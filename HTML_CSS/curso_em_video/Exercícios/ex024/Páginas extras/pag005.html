<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript(JS)</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <a href="#" onclick="clicou()">Clique aqui</a>
    <div id="saida"></div>
    

    <script>
        function clicou() {
            s = window.document.getElementById('saida')
            s.innerHTML += '<p style="color: blue; background-color: #e0e0e0; "><strong style="color: darkblue;">Parabéns!</strong> Você clicou no botão.</p>'
        }
    </script>
</body>
</html>
