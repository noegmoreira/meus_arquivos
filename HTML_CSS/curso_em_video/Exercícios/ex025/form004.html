<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 004</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Teste de Formulários</h1>
    <form action="cadastro.php" method="GET" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" placeholder="Digite seu Nome aqui" autocomplete="name" required>
            </p>
            <p>
                <label for="iemail">E-Mail:</label>
                <input type="email" name="email" id="iemail" placeholder="Digite seu E-mail aqui" autocomplete="email"
                    required>
            </p>
            <p>
                <label for="itel">Telefone:</label>
                <input type="tel" name="tel" id="itel" placeholder="(XX)XXXX-XXXX" autocomplete="tel"
                    pattern="^\(\d{2}\)\d{4,5}-\d{4}$" required>
            </p>
            <!-- Estudar RegEx -->
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </fieldset>
    </form>
</body>

</html>
