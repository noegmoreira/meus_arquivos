<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="GET" autocomplete="on">
        <p>
            <label for="iest"> Estado</label>
            <select name="estado" id="iest">
                <optgroup label="Suldeste">
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="SP"> São Paulo</option>
                </optgroup>
                <optgroup label="Nordeste">
                    <option value="MA">Maranhão</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="PE">Pernanbuco</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="iprof">Profissão</label>
            <input type="text" name="prof" id="iprof" placeholder="Digite sua Profissão aqui" autocomplete="off" list="istprof">
            <datalist id="istprof">
                <option value="PROG">Programador</option>
                <option value="MEDI">Médico</option>
                <option value="PROF">Professor</option>
                <option value="ENGE">Engenheiro</option>
            </datalist>
        </p>
        <p>
            <label for="imsg">Mensagem: </label><br> 
            <textarea name="msg" id="img" cols="30" rows="10" placeholder="Mensagem aqui:"></textarea>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
    
</html>
