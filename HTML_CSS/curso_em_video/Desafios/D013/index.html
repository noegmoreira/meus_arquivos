<!DOCTYPE html>
<html lang="pt-br">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Desafio de Mesclagens de células</title>

        <style>
                body {
                        font-family: Arial, sans-serif;
                }

                table {
                        border-collapse: collapse;
                        width: 50%;
                        margin: 20px auto;
                }

                td {
                        border: 1px solid #000;
                        padding: 10px;
                        text-align: center;
                }

                h2 {
                        text-align: center;
                }
        </style>
</head>

<body>
        <h1>Desafio 13</h1>
        <p>Fazer uma tabela de 15 células usando "colpan" e "rowpan"</p>
        <h2>----- Parte 1 -----</h2>
        <table>
                <tr>
                        <td>1</td>
                        <td>2</td>
                        <td rowspan="2">3</td>
                        <td>4</td>

                </tr>
                <tr>
                        <td>5</td>
                        <td>6</td>
                        <td>7</td>


                </tr>
                <tr>
                        <td colspan="3">8</td>
                        <td>9</td>


                </tr>
                <tr>
                        <td rowspan="2">10</td>
                        <td colspan="2">11</td>
                        <td>12</td>
                </tr>
                <tr>
                        <td>13</td>
                        <td>14</td>
                        <td>15</td>
                </tr>
        </table>

        <h2>----- Parte 2 -----</h2>

        <table>
                <tr>
                        <td colspan="4">A</td>
                        <td rowspan="4">B</td>
                </tr>
                <tr>
                        <td rowspan="4">C</td>
                        <td>D</td>
                        <td>E</td>
                        <td>F</td>

                </tr>
                <tr>
                        <td>G</td>
                        <td>H</td>
                        <td>I</td>
                </tr>
                <tr>
                        <td>J</td>
                        <td>K</td>
                        <td>L</td>
                </tr>
                <tr>
                        <td colspan="4">M</td>
                </tr>
        </table>

</body>

</html>
