<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stellar Jump: Cosmic Odyssey</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        background: radial-gradient(circle at top, #1d1140 0%, #060611 60%, #000000 100%);
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
    }

    #hud {
        position: absolute;
        top: 15px;
        left: 15px;
        color: white;
        font-size: 18px;
        text-shadow: 0 0 10px cyan;
        z-index: 10;
    }

    #info {
        position: absolute;
        bottom: 15px;
        left: 15px;
        color: rgba(255,255,255,0.8);
        font-size: 14px;
        z-index: 10;
    }
</style>
</head>
<body>

<div id="hud">
    ✦ Fragmentos: <span id="score">0</span>
</div>

<div id="info">
    A/D = mover • Espaço = pular • Shift = dash
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const gravity = 0.35;
const keys = {};
let particles = [];
let stars = [];
let fragments = [];
let enemies = [];
let platforms = [];
let score = 0;

const player = {
    x: 100,
    y: 300,
    w: 42,
    h: 52,
    vx: 0,
    vy: 0,
    speed: 0.7,
    maxSpeed: 7,
    jumpForce: -10,
    grounded: false,
    dashCooldown: 0,
    visorGlow: 'cyan'
};

for(let i=0;i<120;i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        alpha: Math.random()
    });
}

platforms = [
    {x:0,y:canvas.height-40,w:2000,h:60},
    {x:250,y:520,w:180,h:20},
    {x:520,y:430,w:160,h:20},
    {x:820,y:360,w:160,h:20},
    {x:1120,y:470,w:220,h:20},
    {x:1500,y:320,w:200,h:20}
];

for(let i=0;i<15;i++) {
    fragments.push({
        x: 200 + i * 120,
        y: 250 + Math.sin(i)*80,
        r: 10,
        collected:false
    });
}

for(let i=0;i<6;i++) {
    enemies.push({
        x: 400 + i * 250,
        y: 100,
        w: 40,
        h: 30,
        dir: Math.random() > 0.5 ? 1 : -1,
        speed: 1.2
    });
}

window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;

    if(e.key === ' ') {
        if(player.grounded) {
            player.vy = player.jumpForce;
            player.grounded = false;
            createBurst(player.x+20, player.y+50, 'cyan');
        }
    }

    if(e.key === 'Shift') {
        if(player.dashCooldown <= 0) {
            player.vx += player.vx >= 0 ? 12 : -12;
            player.dashCooldown = 60;
            createBurst(player.x+20, player.y+20, 'magenta');
        }
    }
});

window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
});

function createBurst(x,y,color) {
    for(let i=0;i<18;i++) {
        particles.push({
            x,
            y,
            vx:(Math.random()-0.5)*6,
            vy:(Math.random()-0.5)*6,
            life:40,
            color
        });
    }
}

function updatePlayer() {

    if(keys['a']) player.vx -= player.speed;
    if(keys['d']) player.vx += player.speed;

    player.vx *= 0.93;

    if(player.vx > player.maxSpeed) player.vx = player.maxSpeed;
    if(player.vx < -player.maxSpeed) player.vx = -player.maxSpeed;

    player.vy += gravity;

    player.x += player.vx;
    player.y += player.vy;

    player.grounded = false;

    platforms.forEach(p => {
        if(
            player.x < p.x + p.w &&
            player.x + player.w > p.x &&
            player.y < p.y + p.h &&
            player.y + player.h > p.y
        ) {
            if(player.vy > 0) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.grounded = true;
            }
        }
    });

    if(player.y > canvas.height + 300) {
        player.x = 100;
        player.y = 300;
        player.vx = 0;
        player.vy = 0;
    }

    if(player.dashCooldown > 0)
        player.dashCooldown--;
}

function updateEnemies() {
    enemies.forEach(enemy => {
        enemy.x += enemy.speed * enemy.dir;

        if(enemy.x < 0 || enemy.x > 1900)
            enemy.dir *= -1;

        if(
            player.x < enemy.x + enemy.w &&
            player.x + player.w > enemy.x &&
            player.y < enemy.y + enemy.h &&
            player.y + player.h > enemy.y
        ) {
            if(player.vy > 0) {
                player.vy = -12;
                createBurst(enemy.x, enemy.y, 'gold');
                enemy.dead = true;
                score += 50;
            } else {
                player.x = 100;
                player.y = 300;
            }
        }
    });

    enemies = enemies.filter(e => !e.dead);
}

function updateFragments() {
    fragments.forEach(f => {
        if(!f.collected) {
            const dx = player.x + player.w/2 - f.x;
            const dy = player.y + player.h/2 - f.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if(dist < 35) {
                f.collected = true;
                score += 10;
                document.getElementById('score').innerText = score;
                createBurst(f.x, f.y, 'white');
            }
        }
    });
}

function updateParticles() {
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
    });

    particles = particles.filter(p => p.life > 0);
}

function drawBackground() {

    const gradient = ctx.createLinearGradient(0,0,0,canvas.height);
    gradient.addColorStop(0,'#1b1147');
    gradient.addColorStop(1,'#020208');

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    stars.forEach(s => {
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
        ctx.fill();
    });

    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.fillStyle = 'rgba(0,255,255,0.08)';
    ctx.arc(canvas.width*0.8,120,180,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.fillStyle = 'rgba(255,0,255,0.05)';
    ctx.arc(canvas.width*0.2,220,240,0,Math.PI*2);
    ctx.fill();
}

function drawPlatforms(cameraX) {
    platforms.forEach(p => {
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'cyan';

        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(p.x-cameraX,p.y,p.w,p.h);

        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x-cameraX,p.y,p.w,p.h);
    });

    ctx.shadowBlur = 0;
}

function drawPlayer(cameraX) {

    ctx.save();

    const speedGlow = Math.abs(player.vx) * 2;

    ctx.shadowBlur = 15 + speedGlow;
    ctx.shadowColor = player.visorGlow;

    ctx.fillStyle = '#f0f0f0';
    ctx.beginPath();
    ctx.roundRect(player.x-cameraX, player.y, player.w, player.h, 14);
    ctx.fill();

    ctx.fillStyle = player.visorGlow;
    ctx.beginPath();
    ctx.roundRect(player.x-cameraX+7, player.y+10, 28, 16, 8);
    ctx.fill();

    if(Math.abs(player.vx) > 3) {
        ctx.strokeStyle = 'rgba(0,255,255,0.5)';
        ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.moveTo(player.x-cameraX+10, player.y+30);
        ctx.lineTo(player.x-cameraX-player.vx*3, player.y+30);
        ctx.stroke();
    }

    ctx.restore();
}

function drawFragments(cameraX) {
    fragments.forEach(f => {
        if(!f.collected) {
            ctx.save();

            ctx.translate(f.x-cameraX, f.y);
            ctx.rotate(Date.now()*0.002);

            ctx.shadowBlur = 20;
            ctx.shadowColor = 'gold';

            ctx.fillStyle = 'gold';

            ctx.beginPath();
            ctx.moveTo(0,-f.r);
            ctx.lineTo(f.r,0);
            ctx.lineTo(0,f.r);
            ctx.lineTo(-f.r,0);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }
    });
}

function drawEnemies(cameraX) {
    enemies.forEach(e => {
        ctx.save();

        ctx.shadowBlur = 15;
        ctx.shadowColor = 'magenta';

        ctx.fillStyle = '#ff00aa';
        ctx.beginPath();
        ctx.arc(e.x-cameraX+20,e.y+15,18,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(e.x-cameraX+20,e.y+15,4,0,Math.PI*2);
        ctx.fill();

        ctx.restore();
    });
}

function drawParticles(cameraX) {
    particles.forEach(p => {
        ctx.globalAlpha = p.life / 40;
        ctx.fillStyle = p.color;

        ctx.beginPath();
        ctx.arc(p.x-cameraX,p.y,3,0,Math.PI*2);
        ctx.fill();
    });

    ctx.globalAlpha = 1;
}

function gameLoop() {

    updatePlayer();
    updateEnemies();
    updateFragments();
    updateParticles();

    const cameraX = player.x - canvas.width/2;

    drawBackground();
    drawPlatforms(cameraX);
    drawFragments(cameraX);
    drawEnemies(cameraX);
    drawPlayer(cameraX);
    drawParticles(cameraX);

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
