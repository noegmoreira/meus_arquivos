<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdoptPet Complete</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="game-container">
        
        <section id="menu-screen" class="screen">
            <h1 style="font-size:4rem; text-shadow:0 5px 10px rgba(0,0,0,0.3); color:white;">🐾 AdoptPet <span style="font-size:1rem; color:#f1c40f">FULL</span></h1>
            <button onclick="goToSaveScreen()">Jogar</button>
            <button onclick="openSettings('menu')">Configurações</button>
        </section>

        <section id="save-screen" class="screen">
            <div class="glass-panel">
                <h2>Selecione um Slot</h2>
                <div style="display:flex; flex-direction:column; width:200px;">
                    <button id="save-btn-1" onclick="selectSave(1)">Slot 1</button>
                    <button id="save-btn-2" onclick="selectSave(2)">Slot 2</button>
                    <button id="save-btn-3" onclick="selectSave(3)">Slot 3</button>
                </div>
                <button class="danger-btn" onclick="showScreen('menu-screen')">Voltar</button>
            </div>
        </section>

        <section id="creation-screen" class="screen">
            <div class="glass-panel">
                <h2>Adote seu Primeiro Pet</h2>
                <div style="display:flex; gap:10px; justify-content:center;">
                    <button onclick="startGame('macho')">Macho (Caramelo)</button>
                    <button onclick="startGame('femea')">Fêmea (Pug)</button>
                </div>
                <button class="danger-btn" onclick="showScreen('save-screen')">Cancelar</button>
            </div>
        </section>

        <section id="game-screen" class="screen">
            <div class="hud glass-panel">
                <div style="font-size:1.5rem; font-weight:bold;">
                    💰 <span id="coin-d">0</span> 💎 <span id="gem-d">0</span>
                    <div style="font-size:0.8rem; color:#555">Global Mult: x<span id="mult-d">1.0</span></div>
                </div>
                <div>
                    <button onclick="openShop()">🛒 Loja</button>
                    <button onclick="openSettings('game')">⚙️</button>
                    <button onclick="saveExit()" class="danger-btn">Sair</button>
                </div>
            </div>
            <div id="play-area" style="width:100%; height:100%;" onclick="handleClick(event)"></div>
        </section>

        <section id="shop-screen" class="screen glass-panel" style="background:rgba(0,0,0,0.95); justify-content:flex-start; padding-top:20px;">
            <div style="margin-bottom:10px; display:flex; gap:5px; flex-wrap:wrap; justify-content:center;">
                <button onclick="filterShop('pets')">🐶 Pets</button>
                <button onclick="filterShop('furniture')">🛋️ Móveis</button>
                <button onclick="filterShop('maps')">🗺️ Mapas</button>
                <button onclick="filterShop('upgrades')" style="background:#f1c40f; color:#333;">⚡ Melhorias</button>
                <button onclick="closeShop()" class="danger-btn">Fechar</button>
            </div>
            <div id="shop-items" class="shop-grid"></div>
        </section>

        <section id="settings-screen" class="screen">
            <div class="glass-panel">
                <h2>Configurações</h2>
                <p>Volume</p> <input type="range" onchange="setVol(this.value)">
                <p>Qualidade</p>
                <div>
                    <button id="q-low" class="quality-btn" onclick="setQuality('low')">Baixa</button>
                    <button id="q-high" class="quality-btn" onclick="setQuality('high')">Alta</button>
                    <button id="q-ultra" class="quality-btn" onclick="setQuality('ultra')">Ultra</button>
                </div>
                <p>Tema</p> <button id="theme-btn" onclick="toggleTheme()">Mudar Tema</button>
                <br><br> <button onclick="backSettings()">Voltar</button>
            </div>
        </section>

        <div id="pet-modal" class="glass-panel">
            <h2 id="m-name">Nome</h2>
            <p style="margin-bottom:10px; font-weight:bold; color:#f1c40f;">Nível Atual: <span id="m-level">1</span></p>
            
            <div style="text-align:left; width:100%;">
                <p>Fome <span id="val-hunger"></span> <div class="bar-bg"><div id="b-hunger" class="bar-fill"></div></div></p>
                <p>Sede <span id="val-thirst"></span> <div class="bar-bg"><div id="b-thirst" class="bar-fill" style="background:#3498db"></div></div></p>
            </div>
            
            <div style="margin-top:15px; padding-top:10px; border-top:1px solid rgba(0,0,0,0.1)">
                <div style="display:flex; gap:5px; justify-content:center;">
                    <button onclick="feed()">Comer ($20)</button>
                    <button onclick="water()">Beber ($10)</button>
                </div>
            </div>

             <div style="margin-top:15px; padding-top:10px; border-top:1px solid rgba(0,0,0,0.1); background:rgba(241, 196, 15, 0.2); border-radius:10px;">
                <h3>Melhorar Pet ⚡</h3>
                <p style="font-size:0.9rem">Aumenta a renda base deste pet.</p>
                <button id="btn-upgrade-pet" onclick="upgradeSelectedPet()" style="background:#f39c12; width:90%">Subir Nível ($?)</button>
            </div>

            <button onclick="closeModal()" class="danger-btn" style="margin-top:10px;">Fechar</button>
        </div>

    </div>

    <audio id="bgm" loop>
        <source src="https://files.freemusicarchive.org/storage-freemusicarchive-org/music/ccCommunity/Kai_Engel/Satin/Kai_Engel_-_04_-_Sentinel.mp3" type="audio/mp3">
    </audio>

    <script src="script.js"></script>
</body>
</html>
